    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js' integrity="sha512-KFHXdr2oObHKI9w4Hv1XPKc898mE4kgYx58oqsc/JqqdLMDI4YjOLzom+EMlW8HFUd0QfjfAvxSL6sEq/a42fQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src='https://www.google.com/recaptcha/api.js' async defer></script>

    <script type="text/javascript">
        $(document).ready(function () {
            $('#contactform').validate({
                errorElement: 'span',
                errorClass: 'validate-has-error',
                // --- FIX IS HERE ---
                errorPlacement: function (error, element) {
                    // Find the closest parent with class 'input-group'
                    // and insert the error element *after* it.
                    if (element.closest('.input-group').length) {
                        error.insertAfter(element.closest('.input-group'));
                    } else {
                        // Fallback for fields not in an input-group (if any)
                        error.insertAfter(element);
                    }
                },
                rules: {
                    fullname: { required: true },
                    phone: { required: true, number: true },
                    address: { required: true },
                    email: { required: true, email: true },
                    // message: { required: true }
                },
                messages: {
                    fullname: { required: "Please enter your Full Name." },
                    phone: { required: "Please enter your Phone Number." },
                    address: { required: "Please enter your Address." },
                    email: { required: "Please enter your Email Address." },
                    // message: { required: "Please enter your Message." }
                },
                submitHandler: function (form) {
                    var recaptcha = $("#g-recaptcha-response").val();
                    if (recaptcha === "") {
                        event.preventDefault();
                        alert("Please check the recaptcha");
                        return false;
                    }

                    const formData = new FormData(form);
                    formData.append("action", "forContact");

                    $("button#submit").attr("disabled", true).text('Processing...');

                    $.ajax({
                        type: "POST",
                        url: "enquery_mail.php",
                        data: formData,
                        dataType: "json",
                        contentType: false,
                        processData: false,
                        success: function (data) {
                            $("button#submit").removeAttr("disabled").text('Submit');
                            $('div#result_msg').html(data.message).css('display', 'block').fadeOut(8000);
                            form.reset();
                            grecaptcha.reset();

                        }
                    });

                    return false;
                }
            });
        });
    </script>

    <script>
        const btn = document.getElementById("backToTop");

        window.addEventListener("scroll", () => {
            btn.classList.toggle("d-none", window.scrollY < 300);
        });

        btn.addEventListener("click", () => {
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
