<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.js'></script>
<script src='https://www.google.com/recaptcha/api.js' async defer></script>
    <script type="text/javascript">
        $(document).ready(function () {
            // Populate modal with career title
            $('#exampleModal').on('show.bs.modal', function (event) {
                var button = $(event.relatedTarget); // Button that triggered the modal
                var title = button.data('title'); // Extract info from data-* attributes
                var modal = $(this);
                modal.find('.modal-title').text('Apply for: ' + title);
                modal.find('.modal-body #career_title').val(title);
            });

            $('#contactform').validate({
                errorElement: 'span',
                errorClass: 'validate-has-error',
                // --- FIX IS HERE ---
                errorPlacement: function (error, element) {
                    // Find the closest parent with class 'input-group'
                    // and insert the error element *after* it.
                    if (element.closest('.input-group').length) {
                        error.insertAfter(element.closest('.input-group'));
                    } else {
                        // Fallback for fields not in an input-group (if any)
                        error.insertAfter(element);
                    }
                },
                rules: {
                    name: { required: true },
                    phone: { required: true, number: true },
                    address: { required: true },
                    email: { required: true, email: true },
                    file:{required:true},
                    message: { required: true }  
                },
                messages: {
                    name: { required: "Please enter your Full Name." },
                    phone: { required: "Please enter your Phone Number." },
                    address: { required: "Please enter your Address." },
                    email: { required: "Please enter your Email Address." },
                    file: { required: "Please Upload your File." },
                    message: { required: "Please enter your Message." }
                },
                submitHandler: function (form) {
                    var recaptcha = $("#g-recaptcha-response").val();
                    if (recaptcha === "") {
                        event.preventDefault();
                        alert("Please check the recaptcha");
                        return false;
                    }

                    console.log("Submit triggered. career_title value is: ", $('#career_title').val());
                    
                    const formData = new FormData(form);
                    formData.append("action", "forCareer");
                    
                    for (var pair of formData.entries()) {
                        console.log(pair[0]+ ', ' + pair[1]); 
                    }

                    $("#btn").attr("disabled", true).text('Processing...');

                    $.ajax({
                        type: "POST",
                        url: "enquery_mail.php",
                        data: formData,
                        dataType: "json",
                        contentType: false,
                        processData: false,
                        success: function (data) {
                            $("#btn").removeAttr("disabled").text('Submit');
                            $('div#result_msg').html(data.message).css('display', 'block').fadeOut(8000);
                            form.reset();
                            grecaptcha.reset(0);
                        }
                    });

                    return false;
                }
            });
        });
    </script>
