    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
    <script src='https://www.google.com/recaptcha/api.js' async defer></script>

    <script type="text/javascript">
        $(document).ready(function () {

            $.validator.addMethod("numbersOnly", function (value, element) {
                return this.optional(element) || /^[0-9]+$/.test(value);
            }, "Only numbers are allowed.");

            $('#contactpage').validate({
                errorElement: 'span',
                errorClass: 'validate-has-error',
                rules: {
                    fullname: { required: true },
                    phone: { required: true, numbersOnly: true },
                    email: { required: true, email: true },
                    Address: { required: true },
                    message: { required: true }
                },
                messages: {
                    fullname: { required: "Please enter your Name." },
                    phone: {
                        required: "Please enter your Phone Number.",
                        numbersOnly: "Only digits are allowed."
                    },
                    email: {
                        required: "Please enter your Email Address.",
                        email: "Please enter a valid Email Address."
                    },
                    Address: { required: "Please enter your Address." },
                    message: { required: "Please enter your Message." }
                },
                submitHandler: function (form) {

                    var recaptcha = grecaptcha.getResponse();
                    if (recaptcha === "") {
                        alert("Please check the recaptcha");
                        return false;
                    }

                    var $btn = $("#ul-submit-btn");
                    var Frmval = $(form).serialize();

                    $btn.attr("disabled", true).html('Processing...');

                    $.ajax({
                        type: "POST",
                        dataType: "JSON",
                        url: "enquery_mail.php",
                        data: "action=forContact&" + Frmval,
                        success: function (data) {

                            $btn.removeAttr("disabled")
                                .html('Get in Touch');

                            if (data.message) {
                                $('#result_msg')
                                    .html(data.message)
                                    .removeClass()
                                    .addClass('alert alert-success')
                                    .show()
                                    .fadeOut(8000);
                            }

                            $('#contactpage')[0].reset();
                            grecaptcha.reset();
                        },
                        error: function () {
                            $btn.removeAttr("disabled")
                                .html('Get in Touch');

                            $('#result_msg')
                                .html('Something went wrong. Please try again.')
                                .removeClass()
                                .addClass('alert alert-danger')
                                .show()
                                .fadeOut(8000);
                        }
                    });

                    return false;
                }
            });
        });
    </script>
