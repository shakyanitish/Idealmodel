    <!-- SIDEBAR SECTION START -->

        <div class="ul-sidebar-header">
            <div class="ul-sidebar-header-logo">
                <a href="index-2.html">
                    <img src="assets/img/logo.png" alt="logo" class="logo">
                </a>
            </div>
            <!-- sidebar closer -->
            <button class="ul-sidebar-closer"><i class="flaticon-close"></i></button>
        </div>
        <div class="ul-sidebar-header-nav-wrapper d-block d-lg-none"></div>

    <main>
        <!-- BREADCRUMBS SECTION START -->
        <section class="ul-breadcrumb ul-section-spacing">

        </section>
        <!-- BREADCRUMBS SECTION END -->

        <!-- ABOUT SECTION START -->
        <section class="ul-about ul-section-spacing wow animate__fadeInUp">
            <div class="ul-container">
                <div class="row justify-content-center gy-4">
                    <div class="col-md-4">
                        <div class="case-inner">
                            <h6 class="mt-2 me-2">Category:</h6>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Select anyone</option>
                                <option value="1">Research</option>
                                <option value="2">Case Study</option>
                                <option value="3">Medical Study</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-center gy-4">

                    <div class="col-md-8">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th scope="col">S.N</th>
                                    <th scope="col">Case Study</th>
                                    <th scope="col">Date</th>
                                    <th scope="col">Type</th>
                                    <th scope="col">Download</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th scope="row">1</th>
                                    <td>Covid-19 Recovery Journey</td>
                                    <td>20th August 2021</td>
                                    <td>PDF</td>
                                    <td><button><a href="#"><img src="assets/img/icon/download.png" alt="download">Download</a></button></td>
                                </tr>
                                <tr>
                                    <th scope="row">2</th>
                                    <td>Stories from Covid-19 Isolation Center</td>
                                    <td>5th June 2021</td>
                                    <td>DOC</td>
                                    <td><button><a href="#"><img src="assets/img/icon/download.png" alt="download">Download</a></button></td>
                                </tr>
                                <tr>
                                    <th scope="row">3</th>
                                    <td>Heart Defect Survivor</td>
                                    <td>10th July 2019</td>
                                    <td>PPT</td>
                                    <td><button><a href="#"><img src="assets/img/icon/download.png" alt="download">Download</a></button></td>
                                </tr>
                                <tr>
                                    <th scope="row">4</th>
                                    <td>Determined to Recover</td>
                                    <td>28th July 2019</td>
                                    <td>IMG</td>
                                    <td><button><a href="#"><img src="assets/img/icon/download.png" alt="download">Download</a></button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <!-- ABOUT SECTION END -->
    </main>

    <!-- FOOTER SECTION START -->
    <jcms:module:footer/>

    <!-- FOOTER SECTION END -->


    <button id="backToTop" class="btn btn-primary rounded-circle position-fixed bottom-0 end-0 m-4 d-none" aria-label="Back to top">
          ↑
    </button>

    <!-- libraries JS -->
    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="assets/vendor/splide/splide.min.js"></script>
    <script src="assets/vendor/splide/splide-extension-auto-scroll.min.js"></script>

    <script src="assets/vendor/slim-select/slimselect.min.js"></script>
    <script src="assets/vendor/animate-wow/wow.min.js"></script>
    <script src="assets/vendor/splittype/index.min.js"></script>
    <script src="assets/vendor/mixitup/mixitup.min.js"></script>
    <script src="assets/vendor/fslightbox/fslightbox.js"></script>

    <script src="assets/js/tab.js"></script>
    <!-- <script src="assets/js/countdown.js"></script> -->
    <script src="assets/js/accordion.js"></script>
    <script src="assets/js/progressbar.js"></script>
    <script src="assets/js/donate-form.js"></script>

    <script>
        const btn = document.getElementById("backToTop");

        window.addEventListener("scroll", () => {
            btn.classList.toggle("d-none", window.scrollY < 300);
        });

        btn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
